<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена (404) | Ольга Тяжкороб</title>
<meta name="description" content="Запрошенная страница не найдена. Вернитесь на главную страницу сайта Ольги Тяжкороб.">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="/ogt-site/assets/img/favicon.png">
<link rel="stylesheet" href="/ogt-site/assets/css/fonts.css">
<style>
:root {
  --bg-main: #fafbf9;
  --text-main: #172720;
  --text-muted: #526359;
  --accent-emerald: #116f56;
  --accent-link: #11654f;
  --border-color: #dce5de;
  --font-heading: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg-main);
  color: var(--text-main);
  font: 400 16px/1.65 var(--font-body);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  justify-content: center;
  align-items: center;
  padding: 24px;
  text-align: center;
}
.error-card {
  max-width: 540px;
  background: #ffffff;
  border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 48px 32px;
  box-shadow: 0 12px 36px rgb(23 39 32 / 5%);
}
.error-code {
  display: inline-block;
  font: 800 64px/1 var(--font-heading);
  color: var(--accent-emerald);
  margin-bottom: 12px;
}
h1 {
  font: 800 24px/1.3 var(--font-heading);
  color: var(--text-main);
  margin-bottom: 14px;
}
p {
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 28px;
}
.error-actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.btn-home {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 22px;
  background: var(--accent-emerald);
  color: #ffffff;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  transition: background 150ms;
}
.btn-home:hover {
  background: #0d5844;
}
.btn-tg {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--accent-link);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
}
.btn-tg:hover {
  text-decoration: underline;
}
a:focus-visible {
  outline: 3px solid var(--accent-link);
  outline-offset: 4px;
}
</style>
</head>
<body>
<main class="error-card">
<span class="error-code" aria-hidden="true">404</span>
<h1>Страница не найдена</h1>
<p>Возможно, адрес изменился или страница была перемещена. Перейдите на главную страницу, чтобы посмотреть проекты и решения.</p>
<div class="error-actions">
<a href="https://olgatazkorob7-png.github.io/ogt-site/" class="btn-home">Вернуться на главную <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></a>
<a href="https://t.me/olga_taz" class="btn-tg" target="_blank" rel="noopener noreferrer">Написать в Telegram: @olga_taz ↗</a>
</div>
</main>
</body>
</html>
